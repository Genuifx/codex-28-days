name: daily-scrape

on:
  schedule:
    # 10:00 and 22:00 Taipei time — Tibo ships ~once a day
    - cron: "0 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape new Day entries
        run: python3 scripts/scrape.py
      - name: Commit if changed
        run: |
          git config user.name "tibo-tracker-bot"
          git config user.email "tibo-tracker-bot@users.noreply.github.com"
          git add data/days.json index.html sitemap.xml llms.txt
          git diff --cached --quiet || (git commit -m "chore: update ship log" && git push)
