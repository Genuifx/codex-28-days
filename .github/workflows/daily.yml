name: daily-scrape

on:
  schedule:
    # 10:00 and 22:00 Taipei time — Tibo ships ~once a day
    - cron: "0 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scraper regression tests
        run: python3 -B -m unittest discover -v
      - name: Scrape new Day entries and author follow-ups
        run: python3 scripts/scrape.py
      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "tibo-tracker-bot"
          git config user.email "tibo-tracker-bot@users.noreply.github.com"
          git add data/days.json index.html zh updates feed.xml sitemap.xml llms.txt assets/og
          git diff --cached --quiet || git commit -m "chore: update ship log"
          git fetch origin main
          if git rebase origin/main; then
            # Even a clean rebase can combine newer source data with older generated pages.
            python3 -B -m scripts.build
            python3 -B -m unittest discover -v
            git add data/days.json index.html zh updates feed.xml sitemap.xml llms.txt assets/og
            git diff --cached --quiet || git commit -m "chore: rebuild merged ship log"
            git push origin HEAD:main
          else
            # Conflicting remote work landed mid-run: regenerate on the latest remote state instead of merging
            git rebase --abort
            git reset --hard origin/main
            python3 scripts/scrape.py
            python3 -B -m unittest discover -v
            git add data/days.json index.html zh updates feed.xml sitemap.xml llms.txt assets/og
            git diff --cached --quiet || git commit -m "chore: update ship log"
            git push origin HEAD:main
          fi

